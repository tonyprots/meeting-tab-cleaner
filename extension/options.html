<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настройки</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Crect x='7' y='11' width='12' height='10' rx='2.5' fill='%23fff'/%3E%3Cpath d='M21 14.2l4-2.4v8.4l-4-2.4z' fill='%23fff'/%3E%3Ccircle cx='23' cy='23' r='6' fill='%23fff'/%3E%3Cpath d='M20.9 20.9l4.2 4.2M25.1 20.9l-4.2 4.2' stroke='%23e03131' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --ink: #16181d;
    --ink-soft: #5f6672;
    --line: #e3e6ea;
    --accent: #3b5bdb;
    --warn: #c92a2a;
    --surface: #fff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    padding: 40px 28px 56px;
    max-width: 616px;
    background: var(--surface);
    color: var(--ink);
    font: 400 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1 { margin: 0 0 6px; font-size: 21px; font-weight: 600; letter-spacing: -0.012em; }
  .lede { margin: 0 0 30px; color: var(--ink-soft); max-width: 48ch; }
  h2 {
    margin: 0 0 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .hint { margin: 0 0 10px; color: var(--ink-soft); max-width: 54ch; }
  section + section { margin-top: 30px; }

  ul { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  label.row {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 2px;
    cursor: pointer;
  }
  label.row input { margin: 0; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
  .title { flex: 1; }
  .badge {
    font-size: 11px;
    line-height: 18px;
    padding: 0 8px;
    border-radius: 9px;
    color: var(--ink-soft);
    background: #f2f4f6;
    white-space: nowrap;
  }
  .badge.ok { color: #1a6b3c; background: #e6f4ec; }
  .badge.ask { color: #8a5a00; background: #fdf3e2; }

  .delay { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  select {
    font: inherit;
    padding: 5px 9px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--surface);
    color: inherit;
  }
  select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .note {
    margin: 14px 0 0;
    padding: 12px 14px;
    border-left: 2px solid var(--line);
    color: var(--ink-soft);
  }
  .foot {
    margin-top: 30px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    color: var(--ink-soft);
  }
  .count { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
  #saved { opacity: 0; transition: opacity .15s; font-size: 13px; }
  #saved.on { opacity: 1; }
  #error { color: var(--warn); margin: 10px 0 0; display: none; }
  #error.on { display: block; }
</style>
</head>
<body>
  <h1 id="t-title"></h1>
  <p class="lede" id="t-subtitle"></p>

  <section>
    <h2 id="t-group-ready"></h2>
    <p class="hint" id="t-group-ready-hint"></p>
    <ul id="ready"></ul>
  </section>

  <section>
    <h2 id="t-group-optional"></h2>
    <p class="hint" id="t-group-optional-hint"></p>
    <ul id="optional"></ul>
    <p id="error"></p>
  </section>

  <section>
    <h2 id="t-delay-head"></h2>
    <div class="delay">
      <label for="delay" id="t-delay"></label>
      <select id="delay">
        <option value="30">30</option>
        <option value="60">60</option>
        <option value="120">120</option>
      </select>
      <span id="t-seconds"></span>
    </div>
    <p class="note" id="t-safety"></p>
  </section>

  <div class="foot">
    <span><span id="t-stats"></span> <span class="count" id="closed">0</span></span>
    <span id="saved"></span>
  </div>

  <script src="platforms.js"></script>
  <script src="options.js"></script>
</body>
</html>
